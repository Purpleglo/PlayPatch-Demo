name: Validate compiled tester release
run-name: Validate ${{ github.event.release.tag_name || 'latest release' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playpatch-release-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download compiled archive and hosting metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RELEASE: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$EVENT_RELEASE"
          if [[ -z "$TAG" ]]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]]; then
            echo 'Invalid release tag'; exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern playpatch-demo.zip --pattern hosting-index.json --pattern release.json --pattern version.json --dir .download
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > .download/release-assets.json
          echo "PLAYPATCH_VALIDATE_RELEASE=$TAG" >> "$GITHUB_ENV"
      - name: Validate compiled contents and retained proxy routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, re, stat, zipfile
          target = Path('site').resolve()
          target.mkdir()
          allowed = {'assets','releases','index.html','app.js','styles.css','version.json','.nojekyll'}
          forbidden = {'.cs','.csproj','.sln','.unity','.prefab','.unitypackage','.blend','.psd','.ai','.pdb','.mdb','.dbg','.cpp','.h','.c','.pem','.key','.p12','.pfx'}
          with zipfile.ZipFile('.download/playpatch-demo.zip') as archive:
              names = set()
              total = 0
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if not path.parts or path.is_absolute() or '..' in path.parts or '\\' in item.filename or path.parts[0] not in allowed:
                      raise SystemExit('Archive contains an unexpected path')
                  if item.filename.casefold() in names or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('Archive contains a duplicate or linked path')
                  names.add(item.filename.casefold())
                  if path.suffix.lower() in forbidden or path.name in {'.env','.npmrc','.gitconfig'} or path.name.endswith(('.symbols.json','.map')):
                      raise SystemExit('Source/debug/private files are forbidden')
                  if item.file_size > 100 * 1024 * 1024:
                      raise SystemExit('Archive file exceeds 100 MiB')
                  total += item.file_size
              if total > 1024 * 1024 * 1024:
                  raise SystemExit('Compiled site exceeds 1 GiB')
              archive.extractall(target)
          tag = os.environ['PLAYPATCH_VALIDATE_RELEASE']
          version = json.loads((target / 'version.json').read_text())
          index = json.loads(Path('.download/hosting-index.json').read_text())
          manifest = json.loads(Path('.download/release.json').read_text())
          if version['release'] != tag or index['release'] != tag or manifest['release'] != tag or index.get('schema') != 1:
              raise SystemExit('Release identity differs between archive and attachments')
          if index['sourceCommit'] != version['sourceCommit'] or manifest['sourceCommit'] != version['sourceCommit']:
              raise SystemExit('Release provenance differs between attachments')
          if Path('.download/version.json').read_bytes() != (target / 'version.json').read_bytes():
              raise SystemExit('Public version attachment differs from archive')
          if Path('.download/release.json').read_bytes() != (target / 'releases' / tag / 'release.json').read_bytes():
              raise SystemExit('Public manifest attachment differs from archive')
          remote = json.loads(Path('.download/release-assets.json').read_text())
          if remote.get('draft'):
              raise SystemExit('Validation requires an atomically published release')
          assets = {entry['name']: entry for entry in remote['assets']}
          for relative, entry in index['files'].items():
              path = PurePosixPath(relative)
              if path.is_absolute() or '..' in path.parts or '\\' in relative:
                  raise SystemExit('Hosting index contains an unbounded route')
              if relative not in {'index.html','app.js','styles.css','version.json'} and not (relative.startswith('assets/') or (len(path.parts) == 3 and path.parts[0] == 'releases' and path.name == 'release.json')):
                  raise SystemExit('Hosting route escaped compiled site')
              file = target / relative
              if not file.is_file() or file.stat().st_size != entry['bytes']:
                  raise SystemExit('Retained hosting route is missing from compiled archive')
              digest = hashlib.file_digest(file.open('rb'), 'sha256').hexdigest()
              if digest != entry['sha256']:
                  raise SystemExit('Hosting route digest differs from compiled archive')
              if relative.startswith('assets/') and entry['asset'] != 'asset-' + digest:
                  raise SystemExit('Compiled asset attachment lacks its content address')
              if entry['release'] == tag:
                  asset = assets.get(entry['asset'])
                  if not asset or asset['state'] != 'uploaded' or asset['size'] != entry['bytes'] or (asset.get('digest') and asset['digest'] != 'sha256:' + digest):
                      raise SystemExit('Current release attachment does not match tested bytes')
          print('Validated compiled release and retained hosting routes:', tag, total, 'bytes')
          PY
