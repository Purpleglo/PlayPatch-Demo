name: Deploy compiled tester demo
run-name: Deploy ${{ github.event.release.tag_name || 'latest release' }}

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playpatch-demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RELEASE: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$ ]]; then
            echo 'Invalid release tag'; exit 1
          fi
          if [[ -n "$EVENT_RELEASE" && "$EVENT_RELEASE" != "$RELEASE_TAG" ]]; then
            echo 'A newer release supersedes this event; keeping the current deployment.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PLAYPATCH_DEPLOY_RELEASE=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - name: Download tested compiled release
        if: steps.release.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$PLAYPATCH_DEPLOY_RELEASE"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern playpatch-demo.zip --dir .download
      - name: Validate and extract compiled site
        if: steps.release.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import json, os, stat, zipfile
          target = Path('site').resolve()
          target.mkdir()
          allowed = {'assets','releases','index.html','app.js','styles.css','version.json','.nojekyll'}
          forbidden = {'.cs','.csproj','.sln','.unity','.prefab','.unitypackage','.blend','.psd','.ai','.pdb','.mdb','.dbg','.cpp','.h','.c','.pem','.key','.p12','.pfx'}
          with zipfile.ZipFile('.download/playpatch-demo.zip') as archive:
              names = set()
              total = 0
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if not path.parts or path.is_absolute() or '..' in path.parts or '\\' in item.filename or path.parts[0] not in allowed:
                      raise SystemExit('Archive contains an unexpected path')
                  if item.filename in names or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('Archive contains a duplicate or linked path')
                  names.add(item.filename)
                  if path.suffix.lower() in forbidden or path.name in {'.env','.npmrc','.gitconfig'} or path.name.endswith(('.symbols.json','.map')):
                      raise SystemExit('Source/debug files are forbidden')
                  if item.file_size > 100 * 1024 * 1024:
                      raise SystemExit('Archive file exceeds 100 MiB')
                  total += item.file_size
              if total > 1024 * 1024 * 1024:
                  raise SystemExit('Compiled site exceeds 1 GiB')
              archive.extractall(target)
          if not all((target / name).is_file() for name in ('index.html','app.js','styles.css','version.json','.nojekyll')):
              raise SystemExit('Compiled site is incomplete')
          version = json.loads((target / 'version.json').read_text())
          if version['release'] != os.environ['PLAYPATCH_DEPLOY_RELEASE']:
              raise SystemExit('Release manifest does not match deployment tag')
          manifest = target / 'releases' / version['release'] / 'release.json'
          if json.loads(manifest.read_text())['sourceCommit'] != version['sourceCommit']:
              raise SystemExit('Release provenance mismatch')
          print('Validated compiled site:', version['release'], total, 'bytes')
          PY
      - name: Configure Pages
        if: steps.release.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload compiled Pages artifact
        if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Recheck latest immediately before deployment
        id: still_latest
        if: steps.release.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [[ "$CURRENT" != "$PLAYPATCH_DEPLOY_RELEASE" ]]; then
            echo 'A newer release was published during preparation; skipping stale deployment.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Pages
        id: deployment
        if: steps.still_latest.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
